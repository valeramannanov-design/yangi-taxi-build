name: yangi_taxi
description: Yangi Taxi passenger app
publish_to: none
version: 1.9.2+34

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  yandex_maps_mapkit: ^4.45.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/car.png
    - assets/pin.png
    - assets/map_car_start.webp
    - assets/map_car_together.webp
    - assets/map_car_comfort.webp
    - assets/map_car_business.webp
    - assets/map_car_delivery.webp
    - assets/map_car_cargo.webp
    - assets/tariff_start.webp
    - assets/tariff_comfort.webp
    - assets/tariff_business.webp
    - assets/tariff_business_v2.webp
    - assets/tariff_delivery.webp
    - assets/tariff_cargo.webp

