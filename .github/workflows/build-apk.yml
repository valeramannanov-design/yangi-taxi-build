name: Build Yangi Taxi APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flutter/**'
      - '.github/workflows/build-apk.yml'
  push:
    paths:
      - 'flutter/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform
        run: |
          flutter create --platforms=android --org uz.yangi --project-name yangi_taxi shell
          cp -R shell/android flutter/android
      - name: Set app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('flutter/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:label="yangi_taxi"', 'android:label="Yangi Taxi"')
          p.write_text(s)
          PY
      - name: Get packages
        working-directory: flutter
        run: flutter pub get
      - name: Build release APK
        working-directory: flutter
        run: flutter build apk --release
      - name: Prepare artifact
        run: cp flutter/build/app/outputs/flutter-apk/app-release.apk Yangi-Taxi-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Yangi-Taxi-demo-apk
          path: Yangi-Taxi-demo.apk
          if-no-files-found: error
