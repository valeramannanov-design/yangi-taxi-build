name: Build Yangi Taxi v1.9.5 Design Pack APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flutter/**'
      - 'backend/**'
      - '.github/workflows/build-apk.yml'
  push:
    paths:
      - 'flutter/**'
      - 'backend/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform
        run: |
          flutter create --platforms=android --org uz.yangi --project-name yangi_taxi shell
          cp -R shell/android flutter/android
      - name: Configure Android app
        run: |
          cp .github/preview-signing/yangi-preview.jks flutter/android/app/yangi-preview.jks
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('flutter/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="yangi_taxi"', 'android:label="Yangi Taxi Design"')
          if 'android:usesCleartextTraffic=' not in text:
              text = text.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          perms = '    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
          if 'ACCESS_FINE_LOCATION' not in text:
              text = text.replace('<application', perms + '    <application', 1)
          manifest.write_text(text)

          gradle_kts = Path('flutter/android/app/build.gradle.kts')
          if gradle_kts.exists():
              g = gradle_kts.read_text()
              g = g.replace('minSdk = flutter.minSdkVersion', 'minSdk = 26')
              g = g.replace('applicationId = "uz.yangi.yangi_taxi"', 'applicationId = "uz.yangi.yangi_taxi.design"')
              signing = chr(10).join([
                  '    signingConfigs {',
                  '        create("preview") {',
                  '            keyAlias = "yangiPreview"',
                  '            keyPassword = "yangi-preview-2026"',
                  '            storeFile = file("yangi-preview.jks")',
                  '            storePassword = "yangi-preview-2026"',
                  '        }',
                  '    }',
                  '',
                  '',
              ])
              if 'create("preview")' not in g:
                  g = g.replace('    buildTypes {', signing + '    buildTypes {', 1)
              g = g.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("preview")')
              if 'play-services-location:21.1.0' not in g:
                  g += '\n\ndependencies {\n    implementation("com.google.android.gms:play-services-location:21.1.0")\n}\n'
              gradle_kts.write_text(g)

          gradle = Path('flutter/android/app/build.gradle')
          if gradle.exists():
              g = gradle.read_text()
              g = g.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 26')
              g = g.replace('applicationId "uz.yangi.yangi_taxi"', 'applicationId "uz.yangi.yangi_taxi.design"')
              signing = chr(10).join([
                  '    signingConfigs {',
                  '        preview {',
                  "            keyAlias 'yangiPreview'",
                  "            keyPassword 'yangi-preview-2026'",
                  "            storeFile file('yangi-preview.jks')",
                  "            storePassword 'yangi-preview-2026'",
                  '        }',
                  '    }',
                  '',
                  '',
              ])
              if 'preview {' not in g:
                  g = g.replace('    buildTypes {', signing + '    buildTypes {', 1)
              g = g.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.preview')
              if 'play-services-location:21.1.0' not in g:
                  g += '\n\ndependencies {\n    implementation "com.google.android.gms:play-services-location:21.1.0"\n}\n'
              gradle.write_text(g)
          PY
      - name: Check backend syntax
        run: |
          node --check backend/server.mjs
          node --check backend/live-check.mjs
          node --check backend/route-price-check.mjs
      - name: Get packages
        working-directory: flutter
        run: flutter pub get
      - name: Build release APK
        working-directory: flutter
        env:
          MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
          BACKEND_URL: ${{ secrets.YANGI_BACKEND_URL }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=MAPKIT_API_KEY="$MAPKIT_API_KEY" \
            --dart-define=BACKEND_URL="${BACKEND_URL:-http://192.168.1.254:8788}"
      - name: Prepare artifact
        run: |
          cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Yangi-Taxi-v1.9.6-arm64.apk
          cp flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Yangi-Taxi-v1.9.6-armv7.apk
          cp flutter/build/app/outputs/flutter-apk/app-x86_64-release.apk Yangi-Taxi-v1.9.6-x86_64.apk
      - name: Prepare backend package
        run: |
          zip -r Yangi-Taxi-backend-v1.9.0-live.zip backend -x "backend/.env"
      - uses: actions/upload-artifact@v4
        with:
          name: Yangi-Taxi-v1.9.6-split-apks
          path: |
            Yangi-Taxi-v1.9.6-arm64.apk
            Yangi-Taxi-v1.9.6-armv7.apk
            Yangi-Taxi-v1.9.6-x86_64.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Yangi-Taxi-backend-v1.9.0-live
          path: Yangi-Taxi-backend-v1.9.0-live.zip
          if-no-files-found: error
