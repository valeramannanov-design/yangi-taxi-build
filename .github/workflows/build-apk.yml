name: Build Yangi Taxi v1.9.4 APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flutter/**'
      - 'backend/**'
      - '.github/workflows/build-apk.yml'
  push:
    paths:
      - 'flutter/**'
      - 'backend/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform
        run: |
          flutter create --platforms=android --org uz.yangi --project-name yangi_taxi shell
          cp -R shell/android flutter/android
      - name: Configure Android app
        run: |
          mkdir -p flutter/android/app/src/main/res/mipmap-xxxhdpi
          cp flutter/android_launcher_icon.jpg flutter/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_yangi.jpg

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('flutter/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="yangi_taxi"', 'android:label="Yangi Taxi"')
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher_yangi"')
          if 'android:roundIcon=' not in text:
              text = text.replace('<application', '<application android:roundIcon="@mipmap/ic_launcher_yangi"', 1)
          if 'android:usesCleartextTraffic=' not in text:
              text = text.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          perms = '    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
          if 'ACCESS_FINE_LOCATION' not in text:
              text = text.replace('<application', perms + '    <application', 1)
          manifest.write_text(text)

          gradle_kts = Path('flutter/android/app/build.gradle.kts')
          if gradle_kts.exists():
              g = gradle_kts.read_text()
              g = g.replace('minSdk = flutter.minSdkVersion', 'minSdk = 26')
              g = g.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              g = g.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
              if 'play-services-location:21.1.0' not in g:
                  g += '\n\ndependencies {\n    implementation("com.google.android.gms:play-services-location:21.1.0")\n}\n'
              gradle_kts.write_text(g)

          gradle = Path('flutter/android/app/build.gradle')
          if gradle.exists():
              g = gradle.read_text()
              g = g.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 26')
              g = g.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
              g = g.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 36')
              if 'play-services-location:21.1.0' not in g:
                  g += '\n\ndependencies {\n    implementation "com.google.android.gms:play-services-location:21.1.0"\n}\n'
              gradle.write_text(g)
          PY
      - name: Validate production signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Configure production signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > flutter/android/app/yangi-taxi-release.jks
          test -s flutter/android/app/yangi-taxi-release.jks

          python3 - <<'PY'
          from pathlib import Path

          path = Path('flutter/android/app/build.gradle.kts')
          if not path.exists():
              raise SystemExit('Expected build.gradle.kts was not generated')

          g = path.read_text()

          marker = '    buildTypes {'
          if marker not in g:
              raise SystemExit('buildTypes block not found in build.gradle.kts')

          signing = '''    signingConfigs {
              create("release") {
                  storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                  storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
              }
          }

          '''
          g = g.replace(marker, signing + marker, 1)

          debug_line = '            signingConfig = signingConfigs.getByName("debug")'
          release_line = '            signingConfig = signingConfigs.getByName("release")'
          if debug_line not in g:
              raise SystemExit('Default debug signing line not found in release build type')
          g = g.replace(debug_line, release_line, 1)

          path.write_text(g)
          PY

      - name: Check backend syntax
        run: |
          node --check backend/server.mjs
          node --check backend/live-check.mjs
          node --check backend/route-price-check.mjs
      - name: Get packages
        working-directory: flutter
        run: flutter pub get
      - name: Validate LIVE build configuration
        env:
          MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
          BACKEND_URL: https://api.yangi-taxi.uz
        run: |
          if [ -z "$MAPKIT_API_KEY" ]; then
            echo "::error::YANDEX_MAPKIT_API_KEY is not configured"
            exit 1
          fi
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::YANGI_BACKEND_URL is not configured"
            exit 1
          fi
          if [ "$BACKEND_URL" = "demo" ]; then
            echo "::error::Production build must not use demo backend"
            exit 1
          fi
          case "$BACKEND_URL" in
            https://*) ;;
            *)
              echo "::error::YANGI_BACKEND_URL must use HTTPS"
              exit 1
              ;;
          esac

      - name: Build release APK
        working-directory: flutter
        env:
          MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
          BACKEND_URL: https://api.yangi-taxi.uz
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/flutter/android/app/yangi-taxi-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter build apk --release \
            --dart-define=MAPKIT_API_KEY="$MAPKIT_API_KEY" \
            --dart-define=BACKEND_URL="$BACKEND_URL"
      - name: Build Play Store AAB
        working-directory: flutter
        env:
          MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
          BACKEND_URL: https://api.yangi-taxi.uz
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/flutter/android/app/yangi-taxi-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter build appbundle --release \
            --dart-define=MAPKIT_API_KEY="$MAPKIT_API_KEY" \
            --dart-define=BACKEND_URL="$BACKEND_URL"
      - name: Validate Play bundle target API
        run: |
          grep -R "targetSdk = 36" flutter/android/app/build.gradle.kts
          grep -R "compileSdk = 36" flutter/android/app/build.gradle.kts
      - name: Prepare artifact
        run: |
          cp flutter/build/app/outputs/flutter-apk/app-release.apk Yangi-Taxi-v1.9.4.apk
          cp flutter/build/app/outputs/bundle/release/app-release.aab Yangi-Taxi-v1.9.4.aab
      - name: Prepare backend package
        run: |
          zip -r Yangi-Taxi-backend-v1.9.4-live.zip backend -x "backend/.env"
      - uses: actions/upload-artifact@v4
        with:
          name: Yangi-Taxi-v1.9.4-apk
          path: Yangi-Taxi-v1.9.4.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Yangi-Taxi-v1.9.4-aab
          path: Yangi-Taxi-v1.9.4.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Yangi-Taxi-backend-v1.9.4-live
          path: Yangi-Taxi-backend-v1.9.4-live.zip
          if-no-files-found: error
